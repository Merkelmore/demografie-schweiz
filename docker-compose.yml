services:
  postgres:
    image: postgres:17-alpine
    container_name: demografie-schweiz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demografie}
      POSTGRES_USER: ${POSTGRES_USER:-demografie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demografie-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data