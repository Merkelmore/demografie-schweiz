services:
  app:
    image: cultural-enrichment-radar:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env.production}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/catalog/map?metric=population_total').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: cultural-enrichment-radar:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.mjs"]
    env_file:
      - ${ENV_FILE:-.env.production}
    restart: "no"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: politik-kompass-schweiz.info
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
