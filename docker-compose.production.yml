name: politik-kompass

services:
  app:
    image: politik-kompass:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-/etc/production-secrets/politik-kompass.env}
    expose:
      - "3000"
    networks:
      gateway:
        aliases:
          - politik-kompass
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/catalog/map?metric=population_total').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    profiles: ["maintenance"]
    image: politik-kompass:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.mjs"]
    env_file:
      - ${MIGRATION_ENV_FILE:-/etc/production-secrets/politik-kompass-migration.env}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  gateway:
    external: true
    name: production_gateway
