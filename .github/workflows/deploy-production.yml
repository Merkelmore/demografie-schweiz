name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: demografie-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the production checkout
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_USER"
          DEPLOY_HOST=46.225.138.103
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
            SSH=(ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST")
          else
            test -n "$DEPLOY_PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$DEPLOY_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST")
          fi
          "${SSH[@]}" "bash -s" <<'REMOTE'
            set -euo pipefail
            mapfile -t compose_files < <(find /srv /home /opt /root -maxdepth 5 -name docker-compose.production.yml -exec grep -l "cultural-enrichment-radar" {} \; 2>/dev/null)
            if [ "${#compose_files[@]}" -ne 1 ]; then
              echo "Expected one Cultural Enrichment Radar production checkout, found ${#compose_files[@]}." >&2
              exit 1
            fi
            cd "$(dirname "${compose_files[0]}")"
            git fetch origin master
            git merge --ff-only origin/master
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
            docker compose --env-file .env.production -f docker-compose.production.yml ps
          REMOTE
